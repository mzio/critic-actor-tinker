# Snorkel Insurance - Debug config (1 train, 1 eval, 1 test)
# Fast smoke test for correctness
# Reference: https://github.com/snorkel-ai/multi-turn-insurance-underwriting-benchmark-generation
name: "snorkel_insurance"
is_async: true

task: "default"
task_data_path: "./data/snorkel_insurance/task_data/downsampled_task_set.json"
data_path: "./data/snorkel_insurance"

grader_model_config:
  name: "claude_query"
  model_config:
    model: "claude-sonnet-4-6"
grader_model_samples: 1
grader_model_verbose: false

hide_observations: false
hidden_obs_content: "..."
first_obs_to_show: 2
last_obs_to_show: 1

# Minimal samples for smoke testing
num_train_samples: 2
num_val_samples: 2
num_test_samples: 1

max_turns: 50
num_tries: 1
eval_num_tries: 1
seed: 0
split: "train"
system_prompt: null
truncation_message: "Sorry, you have reached the maximum number of steps. Please try again."
verbose: false
