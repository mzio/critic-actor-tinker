# Chat Claude Generator: policy LLM generates a chat message (tip / reflection)
# that is injected into Claude's prompt to guide its action.
name: "chat_claude"
prompt_template_name: "chat"
no_cria_prompt: false

# Claude Agent SDK options
model: "claude-haiku-4-5"
permission_mode: "default"
effort: "low"
max_agent_turns: 1

discount_factor: 0.9
mean_center: false

verbose: false
streamer: false
debug: false
