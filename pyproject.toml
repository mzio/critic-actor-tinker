[project]
name = "critic-actor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Michael Zhang", email = "mzhang2016@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.8.2",
    "matplotlib>=3.10.8",
    "omegaconf>=2.3.0",
    "pandas>=3.0.1",
    "peft>=0.18.1",
    "python-dotenv>=1.2.2",
    "rich>=14.3.3",
    "tinker>=0.15.0",
    "tinker-cookbook>=0.1.0",
    "torch>=2.10.0",
    "transformers>=5.3.0",
    "wandb>=0.25.1",
]

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
